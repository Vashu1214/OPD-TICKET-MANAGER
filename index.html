<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cafe - OPD Ticket Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #b71c1c; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #b71c1c; color: white; border: none; padding: 10px 15px; margin-top: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 Fast OPD Data Entry</h2>
    
    <label>Patient Name:</label>
    <input type="text" id="pName" placeholder="Enter Name">

    <label>Birth Year:</label>
    <input type="number" id="pYear" placeholder="e.g. 1990">

    <label>District:</label>
    <input type="text" id="pDist" placeholder="Enter District">

    <label>Police Station (P.S):</label>
    <input type="text" id="pPS" placeholder="Enter P.S">

    <label>OPD Department:</label>
    <select id="pOPD">
        <option>General Medicine</option>
        <option>Orthopaedic</option>
        <option>Cardiology</option>
        <option>Gynaecology/Obstetrics</option>
    </select>

    <button onclick="saveData()">Save Patient Data</button>
</div>

<script>
    function saveData() {
        alert("✅ Data Saved Successfully! (Ab isko script se connect karenge)");
    }
</script>

</body>
</html>
